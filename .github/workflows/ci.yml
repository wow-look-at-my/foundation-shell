name: CI

on:
  push:

# go-toolchain's autorelease (on by default) publishes branch builds to
# buildhost; it verifies up front that the workflow grants id-token: write
# (OIDC for buildhost auth) and actions: read (artifact download) and fails
# the build if either is missing.
permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Go module lives in src/, not the repo root. go-toolchain's matrix
      # command reads go.mod from its working directory (no module
      # auto-discovery on this path), builds into <working-directory>/build/,
      # and the action uploads that same directory as the artifact.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: src

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: curl -fsSL https://github.com/casey/just/releases/download/1.56.0/just-1.56.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin just
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - run: just build
      - run: bats tests/
