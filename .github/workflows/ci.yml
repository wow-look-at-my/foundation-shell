name: CI

on:
  push:

# Every permission below is load-bearing; see docs/ci.md.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go-toolchain sandboxes every dats command; see docs/ci.md.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # The Go module lives in src/, not the repo root; see docs/ci.md.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: src
          # Native per-platform binaries, not a cosmo fat APE; see docs/ci.md.
          os: linux,darwin,windows
          arch: amd64,arm64
