name: CI

on:
  push:

# Every permission below is load-bearing; see docs/ci.md.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Go module lives in src/, not the repo root; see docs/ci.md.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: src

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: curl -fsSL https://github.com/casey/just/releases/download/1.56.0/just-1.56.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin just
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - run: just build
      - run: bats tests/
